interface:
  display_name: "dingxinglizi"
  short_description: "Task-sized delivery and large-repository review"
  default_prompt: "Use $software-project-orchestrator. Before initialization, lifecycle loading, or delegation, classify the current delta as QUICK_PATCH, BOUNDED_CHANGE, or GOVERNED_DELIVERY; explicit invocation does not authorize the heavy workflow. Report scope, Agents, time, validation, and escalation triggers, then use only the minimum roles. Keep project facts authoritative, model recommendation/override/launch evidence separate, and preserve independent QA when required. For a large repository, pin the target, inventory scope/exclusions, create budgeted module/risk shards, keep review_only read-only unless review_and_fix is authorized, and claim at most COMPLETE_FOR_DECLARED_SCOPE."
